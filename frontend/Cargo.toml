[package]
name = "campus-map"
version = "0.1.0"
edition = "2024"

[dependencies]

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
getrandom = { version = "0.2", features = ["js"] }
leptos = {version = "0.8.19", features = ["csr"]}
petgraph = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

